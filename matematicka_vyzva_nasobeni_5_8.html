<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veselé zimní počítání</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:Verdana,Arial,sans-serif;background:linear-gradient(135deg,#d7f1ff,#eef7ff,#dce9ff);color:#243047}
.card{background:white;border:4px solid #9bc9e8;border-radius:24px;padding:24px;max-width:850px;width:100%;box-shadow:0 8px 25px #436b8a33;text-align:center}
h1{font-size:clamp(25px,5vw,42px);margin:8px 0;color:#17618b}.sub{font-size:18px}.buttons{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0}.btn{border:0;border-radius:14px;padding:16px 22px;background:#2185c5;color:white;font-size:20px;font-weight:bold;cursor:pointer}.btn:hover{background:#17618b}.secondary{background:#e7f4ff;color:#17618b}.hidden{display:none}.stats{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap;font-weight:bold;font-size:18px;margin:15px 0}.question{font-size:clamp(40px,8vw,64px);font-weight:bold;margin:22px 0}.answer{width:min(250px,90%);font-size:30px;padding:12px;border:3px solid #9bc9e8;border-radius:12px;text-align:center}.feedback{min-height:36px;font-size:22px;font-weight:bold;margin:12px}.snow{font-size:34px}.small{font-size:16px;color:#526579}
</style>
</head>
<body>
<div class="card">
<div class="snow">❄️ ☃️ ❄️</div><h1>Veselé zimní počítání</h1><p class="sub">Procvič si násobení a dělení čísly 5 až 8!</p>
<div id="start">
<p>Čeká tě 20 příkladů. Na každý máš 10 sekund.</p>
<div class="buttons"><button class="btn" onclick="startGame('mix')">🎲 Mix násobení a dělení</button><button class="btn secondary" onclick="startGame('mul')">✖️ Jen násobení</button><button class="btn secondary" onclick="startGame('div')">➗ Jen dělení</button></div>
</div>
<div id="game" class="hidden"><div class="stats"><span>❄️ Příklad: <span id="round">1</span>/20</span><span>⭐ Body: <span id="score">0</span></span><span>⏱️ Čas: <span id="time">10</span>s</span></div><div class="question" id="q">?</div><input class="answer" id="ans" type="number" inputmode="numeric" autocomplete="off" aria-label="Výsledek"><div class="feedback" id="feedback"></div><button class="btn" onclick="submitAnswer()">Odpovědět</button></div>
<div id="end" class="hidden"><h2 id="result"></h2><p id="detail"></p><button class="btn" onclick="location.reload()">🔁 Hrát znovu</button></div>
</div>
<script>
let mode='mix',round=0,score=0,correct=0,timeLeft=10,timer=null,locked=false;
function startGame(m){mode=m;round=0;score=0;document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');nextQ()}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function nextQ(){stopTimer();if(round>=20){finish();return}round++;locked=false;timeLeft=10;document.getElementById('round').textContent=round;document.getElementById('score').textContent=score;document.getElementById('time').textContent=timeLeft;document.getElementById('feedback').textContent='';document.getElementById('ans').value='';document.getElementById('ans').disabled=false;let op=mode==='mix'?(Math.random()<.5?'m':'d'):mode;let a,b;if(op==='m'){a=Math.floor(Math.random()*4)+5;b=Math.floor(Math.random()*10)+1;correct=a*b;document.getElementById('q').textContent=a+' × '+b+' = ?'}else{b=Math.floor(Math.random()*4)+5;a=b*(Math.floor(Math.random()*10)+1);correct=a/b;document.getElementById('q').textContent=a+' ÷ '+b+' = ?'}document.getElementById('ans').focus();timer=setInterval(()=>{timeLeft--;document.getElementById('time').textContent=timeLeft;if(timeLeft<=0){stopTimer();feedback(false,true)}},1000)}
function submitAnswer(){if(locked)return;let val=document.getElementById('ans').value;if(val==='')return;feedback(Number(val)===correct,false)}
function feedback(ok,timeout){locked=true;stopTimer();document.getElementById('ans').disabled=true;if(ok){score++;document.getElementById('feedback').textContent='✅ Správně!';document.getElementById('feedback').style.color='#168447'}else{document.getElementById('feedback').textContent=timeout?'⏰ Čas vypršel! Správně: '+correct:'❌ Správně je '+correct;document.getElementById('feedback').style.color='#c33'}document.getElementById('score').textContent=score;setTimeout(nextQ,900)}
function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('end').classList.remove('hidden');document.getElementById('result').textContent='🎉 Hotovo! Získal/a jsi '+score+' z 20 bodů!';document.getElementById('detail').textContent=score===20?'Fantastické! Všechny příklady správně!':score>=15?'Skvělá práce!':score>=10?'Dobrá práce, ještě trochu tréninku!':'Nevadí, zkus to znovu a bude to lepší!'}
document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')submitAnswer()});
</script>
</body>
</html>
