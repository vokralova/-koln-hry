<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematická výzva</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#b8e7ff,#e8f7ff,#d8dfff);font-family:Arial;color:#243047}.card{background:white;border-radius:24px;padding:30px;text-align:center;width:min(700px,95%);box-sizing:border-box;box-shadow:0 10px 30px #0002}h1{font-size:clamp(25px,5vw,38px)}button{background:#2185c5;color:white;border:0;border-radius:14px;padding:14px;margin:6px;font-size:18px;font-weight:bold;cursor:pointer}.secondary{background:#dff5ff;color:#17618b}.stats{display:flex;justify-content:space-around;background:#f4f6ff;padding:12px;border-radius:14px}#q{font-size:clamp(40px,8vw,64px);margin:25px}input{width:150px;font-size:30px;padding:10px;text-align:center;border:3px solid #a8ddf5;border-radius:14px}#fb{min-height:32px;font-size:20px;font-weight:bold;margin:15px}.hidden{display:none}#bar{height:10px;background:#2185c5;border-radius:9px;width:0}#track{background:#eee;border-radius:9px;margin:16px 0}</style><div class="card"><h1>❄️ Veselé zimní počítání</h1><p>⛄ Násobení a dělení čísly 5, 6, 7 a 8</p><div id="start"><p>20 příkladů · 10 sekund na každý</p><button onclick="start('mix')">🔀 Mix</button><button class="secondary" onclick="start('m')">✖️ Násobení</button><button class="secondary" onclick="start('d')">➗ Dělení</button></div><div id="game" class="hidden"><div class="stats">❄️ <span id="s">0</span> bodů · 📝 <span id="n">1</span>/20 · ⏱️ <span id="t">10</span>s</div><div id="track"><div id="bar"></div></div><div id="q"></div><input id="ans" type="number" inputmode="numeric"><br><button onclick="submit()">Odpovědět</button><div id="fb"></div></div><div id="end" class="hidden"><h2 id="result"></h2><p id="detail"></p><button onclick="start('mix')">🔁 Hrát znovu</button></div></div><script>
let mode,score=0,n=0,correct,t=10,timer,locked=false;function start(m){mode=m;score=n=0;document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');document.getElementById('game').classList.remove('hidden');next()}function next(){if(n===20){finish();return}n++;t=10;locked=false;document.getElementById('n').textContent=n;document.getElementById('s').textContent=score;document.getElementById('t').textContent=t;document.getElementById('bar').style.width=((n-1)/20*100)+'%';document.getElementById('fb').textContent='';let op=mode==='mix'?(Math.random()<.5?'m':'d'):mode,x=Math.floor(Math.random()*4)+5,y=Math.floor(Math.random()*10)+1;if(op==='m'){correct=x*y;document.getElementById('q').textContent=x+' × '+y+' = ?'}else{correct=y;document.getElementById('q').textContent=(x*y)+' ÷ '+x+' = ?'}let a=document.getElementById('ans');a.value='';a.focus();clearInterval(timer);timer=setInterval(()=>{t--;document.getElementById('t').textContent=t;if(t<=0){clearInterval(timer);if(!locked){locked=true;feedback(false,true);setTimeout(next,900)}}},1000)}function submit(){if(locked||document.getElementById('ans').value==='')return;locked=true;clearInterval(timer);feedback(Number(document.getElementById('ans').value)===correct,false);setTimeout(next,900)}function feedback(ok,timeout){let f=document.getElementById('fb');if(ok){score++;document.getElementById('s').textContent=score;f.textContent='☃️ Správně!';f.style.color='green'}else{f.textContent=(timeout?'⏰ Čas! ':'❌ ')+ 'Správná odpověď: '+correct;f.style.color='#c33'}}document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});function finish(){clearInterval(timer);document.getElementById('game').classList.add('hidden');document.getElementById('end').classList.remove('hidden');document.getElementById('result').textContent='🏆 '+score+' z 20 bodů!';document.getElementById('detail').textContent=score===20?'Úžasné, všechno správně!':score>=16?'Skvělá práce!':score>=10?'Dobré, ještě potrénuj!':'Nevadí, zkus to znovu!'}
</script></html>
