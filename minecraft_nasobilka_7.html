<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Minecraft – Násobilka 6 a 7</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Verdana,Arial,sans-serif;background:#172b18;color:#fff;text-align:center;min-height:100vh;background-image:linear-gradient(#152b18 0 55%,#304b22 55% 100%)}
main{max-width:850px;margin:0 auto;padding:22px}.panel{background:#263d26;border:5px solid #6c8b45;box-shadow:0 0 0 5px #172b18;padding:24px;border-radius:8px}
h1{font-size:clamp(25px,5vw,42px);color:#f4d35e;text-shadow:3px 3px #493b17;margin:8px}p{line-height:1.5}.pixel{font-size:64px;filter:drop-shadow(4px 4px #172b18)}
.stats{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap;margin:18px 0}.stat{background:#496b35;border:3px solid #a1bd65;padding:10px 18px;font-weight:bold}.question{font-size:clamp(35px,7vw,60px);margin:24px 0;color:#fff}.answer{font-size:28px;padding:12px;width:180px;text-align:center;border:4px solid #a1bd65;border-radius:5px;background:#e8f2d2;color:#172b18}.btn{font-size:18px;font-weight:bold;background:#6e9d38;color:white;border:4px solid #b2cf72;padding:12px 22px;cursor:pointer;margin:8px;border-radius:4px;box-shadow:3px 3px #172b18}.btn:hover{background:#82b84a}.feedback{font-size:22px;font-weight:bold;min-height:40px;margin:12px}.hidden{display:none}.progress{height:18px;background:#1c2917;border:2px solid #95b65c;margin:14px}.bar{height:100%;background:#f4d35e;width:0%;transition:.3s}.timer-track{height:14px;background:#1c2917;border:2px solid #95b65c;margin:8px auto 16px;max-width:360px}.timer-fill{height:100%;width:100%;background:#70c957;transition:width .25s linear}.timer-label{font-size:20px;font-weight:bold;color:#f4d35e;margin-top:10px}.small{font-size:14px;color:#dce8c8}.stone{font-size:34px;margin:4px}.mode button{min-width:170px}
</style></head><body><main><div class="pixel">⛏️ 🟩 💎</div><h1>MINECRAFT: MISE NÁSOBILKA 6 A 7</h1><p>Vydáš se do dolu za diamanty! Procvič násobení i dělení šesti a sedmi a získej poklad.</p><div class="panel" id="start"><h2>Vyber si svou misi!</h2><div class="mode"><button class="btn" onclick="startGame('mix')">⚔️ Smíšená mise</button><button class="btn" onclick="startGame('mul')">🧱 Násobení</button><button class="btn" onclick="startGame('div')">💎 Dělení</button></div><p class="small">10 úkolů • 3 životy • 10 sekund na každý příklad • diamanty za správné odpovědi</p></div>
<div class="panel hidden" id="game"><div class="stats"><div class="stat">💎 Diamanty: <span id="score">0</span></div><div class="stat">❤️ Životy: <span id="lives">3</span></div><div class="stat">⛏️ Úkol: <span id="round">1</span>/10</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="timer-label">⏱️ Zbývá: <span id="timer">10</span> sekund</div><div class="timer-track"><div class="timer-fill" id="timerBar"></div></div><div class="question" id="question"></div><input class="answer" id="answer" type="number" inputmode="numeric" aria-label="Odpověď"><div><button class="btn" onclick="check()">⛏️ Ověřit</button></div><div class="feedback" id="feedback"></div><div class="stone" id="reward"></div></div>
<div class="panel hidden" id="end"><h2 id="endTitle"></h2><div class="pixel" id="endIcon"></div><p id="endText"></p><button class="btn" onclick="location.reload()">🔄 Hrát znovu</button></div></main>
<script>
let mode='mix',round=0,score=0,lives=3,answer=0,lock=false,timeLeft=10,timerInterval=null;
function startGame(m){mode=m;round=0;score=0;lives=3;document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');next()}
function stopTimer(){if(timerInterval!==null){clearInterval(timerInterval);timerInterval=null}}
function startTimer(){stopTimer();timeLeft=10;document.getElementById('timer').textContent=timeLeft;document.getElementById('timerBar').style.width='100%';timerInterval=setInterval(()=>{timeLeft--;document.getElementById('timer').textContent=timeLeft;document.getElementById('timerBar').style.width=(timeLeft*10)+'%';if(timeLeft<=3)document.getElementById('timerBar').style.background='#e65b45';else document.getElementById('timerBar').style.background='#70c957';if(timeLeft<=0){stopTimer();timeExpired()}},1000)}
function timeExpired(){if(lock)return;lock=true;lives--;document.getElementById('lives').textContent=lives;document.getElementById('feedback').textContent='⏰ Čas vypršel! Správná odpověď: '+answer;document.getElementById('feedback').style.color='#ffb4a2';document.getElementById('reward').textContent='⌛';setTimeout(next,1300)}
function next(){stopTimer();if(round>=10||lives<=0){end();return}round++;lock=false;let table=Math.random()<.5?6:7;let factor=Math.floor(Math.random()*10)+1;let typ=mode==='mix'?(Math.random()<.5?'mul':'div'):mode;if(typ==='mul'){answer=table*factor;document.getElementById('question').textContent=table+' . '+factor+' = ?'}else{let product=table*factor;answer=factor;document.getElementById('question').textContent=product+' : '+table+' = ?'}document.getElementById('round').textContent=round;document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('bar').style.width=((round-1)*10)+'%';document.getElementById('answer').value='';document.getElementById('answer').focus();document.getElementById('feedback').textContent='';document.getElementById('reward').textContent='';startTimer();}
function check(){if(lock)return;let val=document.getElementById('answer').value;if(val==='')return;lock=true;stopTimer();if(Number(val)===answer){score+=10;document.getElementById('feedback').textContent='🎉 Správně! Získáváš diamant!';document.getElementById('feedback').style.color='#f4d35e';document.getElementById('reward').textContent='💎'}else{lives--;document.getElementById('feedback').textContent='❌ Vedle! Správná odpověď: '+answer;document.getElementById('feedback').style.color='#ffb4a2';document.getElementById('reward').textContent='🪨'}document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;setTimeout(next,1300)}
document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
function end(){stopTimer();document.getElementById('game').classList.add('hidden');document.getElementById('end').classList.remove('hidden');document.getElementById('endIcon').textContent=score>=80?'🏆💎':score>=50?'⛏️✨':'🪨';document.getElementById('endTitle').textContent=score>=80?'Minecraft mistr!':score>=50?'Dobrý průzkumník!':'Nevzdávej to, horníku!';document.getElementById('endText').textContent='Získal/a jsi '+score+' diamantových bodů z 100. '+(score>=80?'Skvěle zvládáš násobilku i dělení šesti a sedmi!':score>=50?'Ještě trochu tréninku a budeš mistr!':'Zkus misi znovu a diamanty na tebe čekají!')}
</script></body></html>
